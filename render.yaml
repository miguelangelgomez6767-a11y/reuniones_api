services:
  - type: web
    name: reuniones-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: reuniones-db
          property: connectionString

databases:
  - name: reuniones-db
    databaseName: reuniones
    user: reuniones_user
    plan: free
